[versions]
assertj-bom = "3.27.7"
awaitility = "4.3.0"
checker-qual = "4.2.2"
concurrency-limits = "0.5.4"
cron4j = "2.2.5"
grpc = "1.83.1"
gson = "2.14.0"
jaeger-client = "1.8.1"
jedis = "8.0.0"
junit-bom = "6.1.3"
log4j-bom = "2.26.1"
mockito-bom = "5.23.0"
oauth2-oidc-sdk = "11.38.2"
opentracing = "0.33.0"
opentracing-grpc = "0.2.3"
plugin-jib = "3.5.4"
plugin-protobuf = "0.10.0"
plugin-version-catalog-update = "1.1.1"
plugin-versions = "0.61.0"
prometheus-simpleclient = "0.16.0"
protobuf = "4.36.0"
rethinkdb-driver = "2.4.4"
slf4j-bom = "2.0.18"
snakeyaml = "2.6"
testcontainers-junit-jupiter = "2.0.5"
typesafe-config = "1.4.9"

[libraries]
assertj-bom = { module = "org.assertj:assertj-bom", version.ref = "assertj-bom" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checker-qual" }
cron4j = { module = "it.sauronsoftware.cron4j:cron4j", version.ref = "cron4j" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jaeger-client = { module = "io.jaegertracing:jaeger-client", version.ref = "jaeger-client" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
log4j-bom = { module = "org.apache.logging.log4j:log4j-bom", version.ref = "log4j-bom" }
mockito-bom = { module = "org.mockito:mockito-bom", version.ref = "mockito-bom" }
oauth2-oidc-sdk = { module = "com.nimbusds:oauth2-oidc-sdk", version.ref = "oauth2-oidc-sdk" }
opentracing-api = { module = "io.opentracing:opentracing-api", version.ref = "opentracing" }
opentracing-grpc = { module = "io.opentracing.contrib:opentracing-grpc", version.ref = "opentracing-grpc" }
opentracing-mock = { module = "io.opentracing:opentracing-mock", version.ref = "opentracing" }
opentracing-noop = { module = "io.opentracing:opentracing-noop", version.ref = "opentracing" }
opentracing-util = { module = "io.opentracing:opentracing-util", version.ref = "opentracing" }
prometheus-simpleclient = { module = "io.prometheus:simpleclient", version.ref = "prometheus-simpleclient" }
prometheus-simpleclient_hotspot = { module = "io.prometheus:simpleclient_hotspot", version.ref = "prometheus-simpleclient" }
prometheus-simpleclient_httpserver = { module = "io.prometheus:simpleclient_httpserver", version.ref = "prometheus-simpleclient" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
rethinkdb-driver = { module = "com.rethinkdb:rethinkdb-driver", version.ref = "rethinkdb-driver" }
slf4j-bom = { module = "org.slf4j:slf4j-bom", version.ref = "slf4j-bom" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers-junit-jupiter" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }

[plugins]
jib = { id = "com.google.cloud.tools.jib", version.ref = "plugin-jib" }
protobuf = { id = "com.google.protobuf", version.ref = "plugin-protobuf" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "plugin-version-catalog-update" }
versions = { id = "io.github.ben-manes.versions", version.ref = "plugin-versions" }
