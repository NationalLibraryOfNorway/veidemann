name: Browser Controller CI

on:
  push:
    branches:
      - "main"
    paths:
      - "browser-controller/**"
      - ".github/workflows/browser-controller-ci.yaml"
  pull_request:
    paths:
      - "browser-controller/**"
      - ".github/workflows/browser-controller-ci.yaml"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/golang-ci.yaml
    with:
      working-directory: browser-controller

  chromedp:
    name: Patched chromedp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache-dependency-path: browser-controller/third_party/chromedp/go.sum

      - name: Run patched chromedp regressions
        working-directory: browser-controller/third_party/chromedp
        run: >-
          go test -race
          -run '^(TestDOMEventConcurrentNodeMapRebuild|TestDOMEventWithoutCurrentFrame|TestWaitReadyForcesNodeReady)$'
          .
