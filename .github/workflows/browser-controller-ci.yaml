name: Browser Controller CI

on:
  push:
    branches:
      - "main"
    paths:
      - "browser-controller/**"
      - "api/**"
      - "recorderproxy/**"
      - ".github/workflows/browser-controller-ci.yaml"
  pull_request:
    paths:
      - "browser-controller/**"
      - "api/**"
      - "recorderproxy/**"
      - ".github/workflows/browser-controller-ci.yaml"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/golang-ci.yaml
    with:
      working-directory: browser-controller

  harvest-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            browser-controller/go.sum
            recorderproxy/go.sum
      - name: Recorder race checks
        working-directory: recorderproxy
        run: go test -race ./... -count=1 -timeout=90s
      - name: Browser controller race checks
        working-directory: browser-controller
        run: go test -race ./... -count=1 -timeout=90s
      - name: Browser, recorder, and diagnostic fixtures
        working-directory: browser-controller
        run: go test -tags=integration ./server -run '^Test(Session_Fetch|DiscoveryAncestry|HistoryDocumentArtifacts|SameURLIframeArtifacts|ChildTargetLifecycleArtifacts|FailedSubresourcePreservesArtifacts)$' -count=1 -timeout=8m
