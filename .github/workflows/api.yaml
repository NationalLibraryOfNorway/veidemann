name: Protobuf

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'proto/**'
      - 'tools/go.mod'
      - 'tools/go.sum'
      - 'buf.gen.go.yaml'
      - '.github/workflows/api.yaml'

  pull_request:
    paths:
      - 'api/**'
      - 'proto/**'
      - 'tools/go.mod'
      - 'tools/go.sum'
      - 'buf.gen.go.yaml'
      - '.github/workflows/api.yaml'

  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            tools/go.sum

      - name: Generate Go code from proto files
        working-directory: api
        run: go generate

      - name: Verify generated files are current
        run: git diff --exit-code
