name: Dashboard Release

on:
  push:
    branches:
      - main
    tags:
      - 'dashboard-v[0-9]+.[0-9]+.[0-9]+*'
    paths:
      - 'dashboard/**'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-and-publish.yaml
    with:
      path: dashboard
