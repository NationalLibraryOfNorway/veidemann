name: Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'proto/**'
      - 'buf.yaml'
      - '.github/workflows/dashboard-ci.yaml'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'proto/**'
      - 'buf.yaml'
      - '.github/workflows/dashboard-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci --no-fund --no-audit --strict-allow-scripts

      - name: Generate dashboard API
        working-directory: dashboard
        run: npm run proto:generate

      - name: Verify generated dashboard API is current
        run: git diff --exit-code -- dashboard/src/api

      - name: Run tests
        working-directory: dashboard
        run: npm test -- --watch=false