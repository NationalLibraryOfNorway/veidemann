server {
    listen 8080;
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /never-main {
        alias /usr/share/nginx/html/events.txt;
        default_type text/html;
        limit_rate_after 4k;
        limit_rate 4k;
    }

    location = /events {
        alias /usr/share/nginx/html/events.txt;
        default_type text/event-stream;
        add_header Cache-Control no-cache;
        # Deliver headers promptly, then keep a long response streaming through
        # the finalization boundary. Throttling headers at 1 B/s tests a stalled
        # upstream handshake instead of EventSource cancellation.
        limit_rate_after 4k;
        limit_rate 4k;
    }

    location = /slow-media.wav {
        alias /usr/share/nginx/html/finite.wav;
        default_type audio/wav;
        add_header Cache-Control no-store;
        limit_rate 1024;
    }

    location = /slow-image.png {
        default_type image/png;
        limit_rate 2048;
    }
}
