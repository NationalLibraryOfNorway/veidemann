apiVersion: v1
id: 75dfe01a-e9cc-4fd2-8aa5-c04878d9f1a1
browserScript:
  browserScriptType: ON_LOAD
  script: |
    async function scroll({
      next,
      count = 100,
      step,
      delay = 250,
      settleDelay = 1000,
      bottomThreshold = 5,
      container = document.scrollingElement || document.documentElement || document.body,
    } = {}) {
      function asPositiveInt(value, fallback) {
        const parsed = parseInt(value, 10);
        return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
      }

      const c = asPositiveInt(count, 100);

      const scrollStep = asPositiveInt(
        step,
        Math.max(300, Math.floor(container.clientHeight * 0.8))
      );

      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

      const beforeTop = container.scrollTop;
      const scrollHeight = container.scrollHeight;
      const viewportHeight = container.clientHeight;
      const maxTop = Math.max(0, scrollHeight - viewportHeight);

      const nearBottom =
        beforeTop + viewportHeight >= scrollHeight - bottomThreshold;

      if (!nearBottom) {
        container.scrollTop = Math.min(beforeTop + scrollStep, maxTop);
        await sleep(delay);
      } else {
        await sleep(settleDelay);
      }

      const afterTop = container.scrollTop;
      const afterScrollHeight = container.scrollHeight;

      const moved = afterTop > beforeTop;
      const grewWhileSettling = afterScrollHeight > scrollHeight;

      if (c - 1 > 0 && (moved || grewWhileSettling)) {
        return {
          waitForData: true,
          next: 'self',
          data: {
            count: c - 1,
            step: scrollStep,
          },
        };
      }

      return {
        next,
        waitForData: true,
      };
    }
  urlRegexp: []
kind: browserScript
meta:
  description: Scroll down count pages
  name: scroll.js

