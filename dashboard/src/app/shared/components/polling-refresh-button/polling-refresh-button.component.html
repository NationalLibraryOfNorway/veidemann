<button mat-icon-button type="button" class="polling-refresh-button"
  [attr.aria-label]="refreshLabel" [matTooltip]="refreshLabel" (click)="refreshNow()">
  <mat-progress-spinner aria-hidden="true" mode="determinate" [diameter]="28" [strokeWidth]="2"
    [value]="progress()">
  </mat-progress-spinner>
</button>
