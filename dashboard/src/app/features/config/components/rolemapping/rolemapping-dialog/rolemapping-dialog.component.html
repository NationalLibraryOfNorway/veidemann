<h2 mat-dialog-title>
  <ng-container i18n="@@rolemappingDetailsCardTitle">Rolemapping</ng-container>
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="layout-column gap-16">
    <mat-form-field>
      <mat-label i18n-placeholder="@@roleMappingDetailsTypeDropdownLabel">
        Type
      </mat-label>
      <mat-select formControlName="identityType">
        <mat-option value="email" i18n="@@roleMappingDetailsTypeOptionEmail">Email</mat-option>
        <mat-option value="group" i18n="@@roleMappingDetailsTypeOptionGroup">Group</mat-option>
      </mat-select>
    </mat-form-field>
    @if (identityType.value === 'email') {
      <mat-form-field>
        <mat-label i18n="@@roleMappingDetailsEmailInputLabel">
        Email
      </mat-label>
        <input matInput formControlName="email">
      </mat-form-field>
    }
    @if (identityType.value === 'group') {
      <mat-form-field>
        <mat-label i18n="@@roleMappingDetailsGroupInputLabel">
        Group
      </mat-label>
        <input matInput formControlName="group">
      </mat-form-field>
    }
    <mat-form-field>
      <mat-label i18n="@@rolemappingDetailsRoleDropdownLabel">
        Role
      </mat-label>
      <mat-select formControlName="roleList" multiple>
        @for (role of roles; track role) {
          <mat-option [value]="role">{{Role[role]}}</mat-option>
        }
      </mat-select>
      @if (! roleList.valid) {
        <mat-error i18n="@@roleMappingDetailsRoleRequiredError">
        A user must be assigned at least one role.
      </mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  @if (showSave) {
    <button mat-raised-button color="accent"
      [disabled]="!canSave"
      [mat-dialog-close]="onDialogClose()"><ng-container i18n="@@commonButtonSave">SAVE</ng-container></button>
  }
  @if (!showSave) {
    <button mat-raised-button color="accent"
      [disabled]="!canUpdate"
      [mat-dialog-close]="onDialogClose()"><ng-container i18n="@@commonButtonUpdate">UPDATE</ng-container></button>
  }
  <button mat-button
    (click)="onRevert()"
    [disabled]="!canRevert"><ng-container i18n="@@commonButtonRevert">REVERT</ng-container></button>
  <button mat-button
    mat-dialog-close><ng-container i18n="@@commonButtonCancel">CANCEL</ng-container></button>
</mat-dialog-actions>
