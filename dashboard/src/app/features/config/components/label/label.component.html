<div class="layout-column">
  <form>
    <mat-form-field>
      <mat-label i18n="@@labelListInputLabel">{{labelText}}</mat-label>
      <mat-chip-grid [disabled]="disabled" #chipList cdkDropList
        (cdkDropListDropped)="onDrop($event)"
        (dragover)="onNativeDragOver($event)" (drop)="onNativeDrop($event)"
        class="layout-row layout-wrap gap-8">
        @for (group of groups$ | async; track group) {
          @for (value of group.values; track value) {
            <mat-chip-row
              [removable]="removable"
              (removed)="onRemoveLabel(group.key, value)"
              (click)="onClickLabel(group.key, value)"
              cdkDrag
              [cdkDragData]="group.key + ':' + value">
              <app-label-display [key]="group.key" [value]="value"></app-label-display>
              @if (removable && !disabled) {
                <button matChipRemove [attr.aria-label]="removeLabelAriaLabel(group.key, value)"
                  (click)="$event.stopPropagation()">
                  <mat-icon>cancel</mat-icon>
                </button>
              }
            </mat-chip-row>
          }
        }
        <input #chipInput
          matInput
          [placeholder]="placeholderText"
          i18n-placeholder="@@labelChipInputPlaceholderText"
          [formControl]="control"
          [matChipInputFor]="chipList"
          [matChipInputSeparatorKeyCodes]="labelInputSeparators"
          (matChipInputTokenEnd)="onSave($event);"
          [matAutocomplete]="auto"/>
      </mat-chip-grid>
      @if (emojiPickerEnabled && !disabled) {
        <button mat-icon-button matSuffix type="button"
          data-testid="emoji-picker-button"
          aria-label="Choose emoji" i18n-aria-label="@@emojiPickerButtonLabel"
          matTooltip="Choose emoji" i18n-matTooltip="@@emojiPickerButtonLabel"
          (click)="onChooseEmoji()">
          <mat-icon>add_reaction</mat-icon>
        </button>
      }
    </mat-form-field>

    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onAutocompleteOptionSelected($event)">
      @for (key of filteredKey$ | async; track key) {
        <mat-option [value]="key">{{key}}</mat-option>
      }
    </mat-autocomplete>
  </form>
</div>
