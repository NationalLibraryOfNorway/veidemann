<div [formGroup]="form" class="layout-column">

  <mat-form-field [hideRequiredMarker]="nameInput.value.length >= 2">
    <mat-label i18n="@@metaNameInputLabel">
      Name
    </mat-label>
    <input matInput #nameInput formControlName="name" required data-testid="name">
    @if (nameInput.value.length < 2) {
      <mat-hint i18n="@@metaNameInputLengthHinht">Minimum 2 characters</mat-hint>
    }
    <mat-error i18n="@@metaNameRequiredError">Name is required.</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label i18n="@@metaDescriptionInputLabel">
      Description
    </mat-label>
    <textarea matInput formControlName="description"
              cdkTextareaAutosize></textarea>
  </mat-form-field>

  <app-labels [kind]="kind" [removable]="editable" formControlName="labelList"></app-labels>
  <app-annotation
    [removable]="editable"
    [suggestions]="annotationSuggestions"
    formControlName="annotationList">
  </app-annotation>

  <ng-container>
    <div class="layout-stack-compact layout-row gap-8">
      @if (created.value) {
        <mat-form-field class="flex-fill">
          <mat-label i18n="@@metaCreatedInputLabel">
          Created
        </mat-label>
          <input matInput formControlName="created" readonly="true">
        </mat-form-field>
      }

      @if (createdBy.value) {
        <mat-form-field class="flex-fill">
          <mat-label i18n="@@metaCreatedByInputLabel">
          Created by
        </mat-label>
          <input matInput formControlName="createdBy" readonly="true">
        </mat-form-field>
      }
    </div>

    <div class="layout-stack-compact layout-row gap-8">
      @if (lastModified.value) {
        <mat-form-field class="flex-fill">
          <mat-label i18n="@@metaLastModifiedInputLabel">
          Last modified
        </mat-label>
          <input matInput formControlName=lastModified readonly="true">
        </mat-form-field>
      }

      @if (lastModifiedBy.value) {
        <mat-form-field class="flex-fill">
          <mat-label i18n="@@metaLastModifiedByInputLabel">
          Last modified by
        </mat-label>
          <input matInput formControlName="lastModifiedBy" readonly="true">
        </mat-form-field>
      }
    </div>
  </ng-container>
</div>
