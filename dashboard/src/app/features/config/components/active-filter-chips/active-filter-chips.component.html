@if (chips.length) {
  <mat-chip-set class="filter-chips" aria-label="Active filters" i18n-aria-label="@@activeConfigFiltersLabel">
    @for (chip of chips; track chip.key + ':' + chip.value) {
      <mat-chip [disabled]="disabled" [matTooltip]="chip.tooltip || ''">
        @if (chip.icon) {
          <mat-icon matChipAvatar aria-hidden="true">{{chip.icon}}</mat-icon>
        }
        @if (chip.labelSelector; as label) {
          @if (label.structured) {
            <app-label-display [key]="label.key" [value]="label.value"></app-label-display>
          } @else {
            {{label.selector}}
          }
        } @else {
          {{chip.label}}
        }
        <button matChipRemove type="button"
          [disabled]="disabled"
          [attr.aria-label]="removeFilterLabel(chip)"
          (click)="onRemoveFilter(chip)">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip>
    }
  </mat-chip-set>
}
