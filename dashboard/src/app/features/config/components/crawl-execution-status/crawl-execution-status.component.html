<div class="execution-summary">
  <app-crawl-execution-metrics-section
    [crawlExecutionStatus]="crawlExecutionStatus"
    [crawlJobDisplayValue]="crawlJobName">
  </app-crawl-execution-metrics-section>

  @if (hasError()) {
    <section class="error-summary" role="alert">
      <h3>
        <mat-icon aria-hidden="true">error</mat-icon>
        <span i18n="@@executionErrorTitle">Error</span>
      </h3>
      <dl>
        @if (crawlExecutionStatus.error.code !== 0) {
          <dt i18n="@@executionErrorCodeLabel">Code</dt>
          <dd>{{crawlExecutionStatus.error.code}}</dd>
        }
        @if (crawlExecutionStatus.error.msg) {
          <dt i18n="@@executionErrorMessageLabel">Message</dt>
          <dd>{{crawlExecutionStatus.error.msg}}</dd>
        }
        @if (crawlExecutionStatus.error.detail) {
          <dt i18n="@@executionErrorDetailLabel">Details</dt>
          <dd>{{crawlExecutionStatus.error.detail}}</dd>
        }
      </dl>
    </section>
  }
</div>
