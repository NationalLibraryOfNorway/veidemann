<form [formGroup]="form">
  <mat-card appearance="outlined">
    <mat-card-header class="card-header-with-helpers">
      <mat-card-title>
        <ng-container i18n="@@entityDetailsCardTitle">Entity</ng-container>
      </mat-card-title>
      <mat-card-subtitle>
        @if (showSave) {
          <ng-container
            i18n="@@commonConfigDetailsCardSubtitle">New (unsaved)
        </ng-container>
        }

      </mat-card-subtitle>
      <ng-content select="[cardHeaderHelpers]"></ng-content>
    </mat-card-header>
    <mat-card-content class="layout-column">
      <app-meta
        formControlName="meta"
        [annotationSuggestions]="annotationSuggestions">
      </app-meta>
      @if (!showSave) {
        <mat-form-field>
          <mat-label i18n="configIdLabel">
          Id
        </mat-label>
          <input matInput formControlName="id" readonly>
          <button mat-icon-button matSuffix type="button" [appCopyId]="configObject.id"
            matTooltip="Copy ID" i18n-matTooltip="@@copyIdTooltip"
            aria-label="Copy ID" i18n-aria-label="@@copyIdTooltip">
            <mat-icon>content_copy</mat-icon>
          </button>
        </mat-form-field>
      }
    </mat-card-content>

    @if (canEdit) {
      <mat-card-actions>
        @if (showSave) {
          <button matButton="filled"
            [disabled]="!canSave"
            (click)="onSave()"
            i18n="@@commonButtonSave">SAVE
      </button>
        }
        @if (!showSave) {
          <button matButton="filled"
            [disabled]="!canUpdate"
            (click)="onUpdate()"
            i18n="@@commonButtonUpdate">UPDATE
      </button>
        }
        <button matButton
          (click)="onRevert()"
          [disabled]="!canRevert"
          i18n="@@commonButtonRevert">REVERT
      </button>
        <span class="flex-fill"></span>
        @if (!showSave && canDelete) {
          <button matButton
            (click)="onDelete()"
            i18n="@@commonButtonDelete">DELETE
      </button>
        }
      </mat-card-actions>
    }
  </mat-card>
</form>
