<mat-card appearance="outlined" class="entity-card">
  <mat-card-header>
    <mat-icon mat-card-avatar>business</mat-icon>
    <mat-card-title>{{name}}</mat-card-title>
    <mat-card-subtitle i18n="@@entityViewFilteredByLabel">Filtered by entity</mat-card-subtitle>
  </mat-card-header>
  @if (labels.length > 0) {
    <mat-card-content>
      <mat-chip-set aria-label="Entity labels" i18n-aria-label="@@entityViewLabelsAriaLabel">
        @for (label of labels; track label) {
          <mat-chip><app-label-display [key]="label.key" [value]="label.value"></app-label-display></mat-chip>
        }
      </mat-chip-set>
    </mat-card-content>
  }
  <mat-card-actions align="end">
    <a matButton [routerLink]="['/config', 'entity', id]">
      <mat-icon>arrow_forward</mat-icon>
      <span i18n="@@entityViewOpenEntityButton">View entity</span>
    </a>
  </mat-card-actions>
</mat-card>
