<form class="dialog-layout" (ngSubmit)="onApply()">
  <h2 mat-dialog-title>
    @if (data.readOnly) {
      <span i18n="@@browserscriptViewScriptDialogTitle">View script: {{data.name}}</span>
    } @else {
      <span i18n="@@browserscriptEditScriptDialogTitle">Edit script: {{data.name}}</span>
    }
  </h2>

  <mat-dialog-content>
    <ngx-monaco-editor class="fullscreen-editor"
      [formControl]="scriptControl"
      [options]="editorOptions">
    </ngx-monaco-editor>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    @if (data.readOnly) {
      <button mat-button type="button" (click)="onCancel()" i18n="@@commonButtonClose">CLOSE</button>
    } @else {
      <button mat-button type="button" (click)="onRevert()" [disabled]="!canRevert"
        i18n="@@commonButtonRevert">REVERT</button>
      <button mat-button type="button" (click)="onCancel()" i18n="@@commonButtonCancel">CANCEL</button>
      <button mat-flat-button type="button" (click)="onApply()" [disabled]="!canApply"
        i18n="@@commonButtonApply">APPLY</button>
    }
  </mat-dialog-actions>
</form>
