<h1 mat-dialog-title i18n="@@pauseCrawlerDialogTitle">Confirm action</h1>
@if (shouldPause) {
  <p mat-dialog-content
    i18n="@@pauseCrawlerDialogConfirmationText"
    >
  Are you sure you want to pause the crawler?
</p>
}
@if (!shouldPause) {
  <p mat-dialog-content
    i18n="@@unpauseCrawlerDialogConfirmationText"
    >
  Are you sure you want to unpause the crawler?
</p>
}

<div mat-dialog-actions>
  <button mat-button
    color="warn"
    [mat-dialog-close]="true"><ng-container i18n="@@commonButtonOk">OK</ng-container></button>
  <button mat-button
    [mat-dialog-close]="false"><ng-container i18n="@@commonButtonCancel">CANCEL</ng-container></button>
</div>
