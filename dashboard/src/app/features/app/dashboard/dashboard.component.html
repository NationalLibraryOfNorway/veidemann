@if (can('read', 'home')) {
    <div class="container content-padding">
      <div class="layout-row layout-wrap gap-16">
        <div class="layout-column gap-16">
          @if (can('read', 'crawlerStatus')) {
            <app-crawlerstatus
              [crawlerStatus]="crawlerStatus$ | async"
              (changeRunStatus)="onChangeRunStatus($event)">
            </app-crawlerstatus>
          }
        </div>
      </div>
    </div>
}
