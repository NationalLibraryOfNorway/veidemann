<h1 mat-dialog-title i18n="@@abortCrawlDialogTitle">Abort crawl?</h1>
<div mat-dialog-content>
  <p i18n="@@abortCrawlDialogDescription">
    The crawl will stop processing new URLs. Already crawled documents will be retained.
  </p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false" i18n="@@commonCancel">
    Cancel
  </button>
  <button class="confirm-abort" mat-flat-button type="button" (click)="onAbortCrawl()">
    <span i18n="@@reportDetailAbortCrawlAction">Abort crawl</span>
  </button>
</div>
