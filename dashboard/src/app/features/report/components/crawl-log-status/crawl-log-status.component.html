<section class="crawl-log-detail" aria-label="Crawl log details"
         i18n-aria-label="@@crawlLogDetailsLabel">
  <header class="detail-header">
    <div class="detail-heading">
      <h1 i18n="@@crawlLogReportStatusCardTitle">Crawl log</h1>
    </div>
    <div class="detail-header-helpers">
      <ng-content select="[detailHeaderHelpers]"></ng-content>
    </div>
  </header>

  <div class="crawl-log-content">
    <div class="table-scroll">
      <table mat-table class="report-table" [dataSource]="getReport()">
        <ng-container matColumnDef="crawlLogEntry">
          <th mat-header-cell *matHeaderCellDef i18n="@@crawlLogReportStatusFieldHeaderCell">Field</th>
          <td mat-cell *matCellDef="let report">
            {{report.key}}
          </td>
        </ng-container>
        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef i18n="@@crawlLogReportStatusValueHeaderCell">Value</th>
          <td mat-cell *matCellDef="let report">
            @if (report.url) {
              <span [innerHTML]="report.value | urlFormat"></span>
            } @else {
              {{report.value}}
            }
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="crawlLogReportDisplayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: crawlLogReportDisplayedColumns"></tr>
      </table>
    </div>

    @if (crawlLog.error; as error) {
      <section class="error-callout" aria-labelledby="crawl-log-error-title">
        <header class="error-callout-header">
          <mat-icon aria-hidden="true">error</mat-icon>
          <h2 id="crawl-log-error-title" i18n="@@executionErrorTitle">Error</h2>
        </header>
        <dl class="error-details">
          <div>
            <dt i18n="@@executionErrorCodeLabel">Code</dt>
            <dd>{{error.code}}: {{ExtraStatusCodes[error.code]}}</dd>
          </div>
          @if (error.msg) {
            <div>
              <dt i18n="@@executionErrorMessageLabel">Message</dt>
              <dd class="monospace">{{error.msg}}</dd>
            </div>
          }
          @if (error.detail) {
            <div>
              <dt i18n="@@executionErrorDetailLabel">Details</dt>
              <dd class="monospace error-text">{{error.detail}}</dd>
            </div>
          }
        </dl>
      </section>
    }
  </div>
</section>
