<div class="container layout-column">
  <div class="scroll flex-fill">
    <table mat-table [dataSource]="dataSource"
      matSort
      [matSortActive]="sortActive"
      [matSortDirection]="sortDirection"
      (matSortChange)="onSortChange($event)">
      <ng-container matColumnDef="uri">
        <th i18n="@@PageLogReportListWarcIdNameHeaderCell" mat-header-cell *matHeaderCellDef mat-sort-header>URI</th>
        <td mat-cell *matCellDef="let row">
          <a class="primary-detail-link" [href]="row.uri" target="_blank" rel="noopener noreferrer"
            (click)="$event.stopPropagation()">{{row.uri}}</a>
        </td>
      </ng-container>
      <ng-container matColumnDef="nrOfResources">
        <th i18n="@@PageLogReportListNrOfResourcesNameHeaderCell" mat-header-cell *matHeaderCellDef mat-sort-header># Resources</th>
        <td mat-cell *matCellDef="let row">{{row.resource?.length}}</td>
      </ng-container>
      <ng-container matColumnDef="nrOfOutlinks">
        <th i18n="@@PageLogReportListNrOfOutlinksNameHeaderCell" mat-header-cell *matHeaderCellDef mat-sort-header># Outlinks</th>
        <td mat-cell *matCellDef="let row">{{row.outlink?.length}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index"
        class="item-row"
        id="{{'row' + i}}"
        tabindex="0"
        (click)="onRowClick(row, $event)"
        (keydown)="onRowKeydown(row, $event)"></tr>
    </table>
    <div #loadMoreSentinel class="load-more-sentinel" aria-hidden="true"></div>
    @if (dataSource?.appendLoading$ | async) { <div class="load-state" role="status">Loading more…</div> }
    @if (dataSource?.appendFailed$ | async) {
      <div class="load-state" role="alert">Could not load more rows. <button mat-button (click)="retry()">Retry</button></div>
    }
  </div>
</div>
