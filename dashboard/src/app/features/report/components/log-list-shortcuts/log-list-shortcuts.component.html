@if (status$ | async; as status) {
  @let jobName = status.jobId | getJobNamePipe | async;
  @let seedName = status.seedId | getSeedNamePipe | async;
  <app-execution-metadata class="log-context-metadata" presentation="metrics"
    [state]="statePresentation(status.state)"
    [desiredState]="statePresentation(status.desiredState)"
    [startTime]="status.startTime"
    [endTime]="status.endTime"
    contextLabel="Crawl job" i18n-contextLabel="@@configKindCrawlJob"
    [contextValue]="jobName || status.jobId"
    additionalContextLabel="Seed" i18n-additionalContextLabel="@@configKindSeed"
    [additionalContextValue]="seedName?.label || status.seedId">
  </app-execution-metadata>

  <app-detail-overflow [label]="actionsMenuLabel">
    <app-crawl-execution-shortcut-helpers
      presentation="menu"
      [crawlExecutionStatus]="status"
      [showPageLog]="logKind === 'crawllog'"
      [showCrawlLog]="false"
      [showCrawlExecution]="true"
      [showCopyId]="false">
    </app-crawl-execution-shortcut-helpers>
  </app-detail-overflow>
}
