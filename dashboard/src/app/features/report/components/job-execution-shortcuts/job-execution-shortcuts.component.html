@if (jobExecutionStatus.state === JobExecutionState.RUNNING && can('abort', 'jobexecution')) {
  <button class="abort-action" mat-button (click)="onAbortJobExecution(jobExecutionStatus)">
    <mat-icon>cancel</mat-icon>
    <span i18n="@@reportDetailAbortCrawlAction">Abort crawl</span>
  </button>
}
<button class="more-actions" mat-icon-button [matMenuTriggerFor]="shortcutMenu"
        aria-label="More actions" i18n-aria-label="@@commonMoreActionsLabel">
  <mat-icon>more_vert</mat-icon>
</button>
<mat-menu #shortcutMenu="matMenu">
  <div class="menu-heading" i18n="@@commonRelatedMenuHeading">Related</div>
  @if (can('read', Kind[Kind.CRAWLJOB])) {
    <a mat-menu-item [routerLink]="['/config', 'crawljobs', jobExecutionStatus.jobId]"
       i18n="@@reportDetailGoToCrawljobAction">
      <mat-icon>work</mat-icon>
      <span>Go to crawljob</span>
    </a>
  }
  @if (can('read', 'crawlexecution')) {
    <a mat-menu-item
       [routerLink]="['/report', 'crawlexecution']"
       [queryParams]="{job_id: jobExecutionStatus.jobId, job_execution_id: jobExecutionStatus.id}"
       i18n="@@reportDetailGoToCrawlExecutionAction">
      <mat-icon>hdr_weak</mat-icon>
      <span>Go to crawl execution</span>
    </a>
  }
</mat-menu>
