<form [formGroup]="form" class="report-filter-form">
  <mat-form-field appearance="outline">
    <mat-label i18n="@@pageLogReportFilterJobExecutionIdLabel">
      JobExecution ID
    </mat-label>
    <input matInput size="37" formControlName="jobExecutionId">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label i18n="@@pageLogReportFilterExecutionIdLabel">
      Execution ID
    </mat-label>
    <input matInput size="37" formControlName="executionId">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label i18n="@@pageLogReportFilterUriLabel">
      URI
    </mat-label>
    <input matInput formControlName="uri">
  </mat-form-field>
</form>
