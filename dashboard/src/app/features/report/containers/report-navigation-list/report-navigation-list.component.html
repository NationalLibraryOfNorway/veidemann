<mat-nav-list>
    @if (can('read', 'jobexecution')) {
      <a mat-list-item
        [routerLink]="['/report' ,'jobexecution']" [routerLinkActive]="['is-active']">
        <mat-icon matListItemIcon>hdr_strong</mat-icon>
        <div matLine i18n="@@reportNavigationLinkJobExecution">JobExecution</div>
      </a>
    }
    @if (can('read', 'crawlexecution')) {
      <a mat-list-item
        [routerLink]="['crawlexecution']" [routerLinkActive]="['is-active']">
        <mat-icon matListItemIcon>hdr_weak</mat-icon>
        <div matLine i18n="@@reportNavigationLinkCrawlExecution">CrawlExecution</div>
      </a>
    }
    @if (can('read', 'pagelog')) {
      <a mat-list-item
        [routerLink]="['pagelog']" [routerLinkActive]="['is-active']">
        <mat-icon matListItemIcon>art_track</mat-icon>
        <div matLine i18n="@@reportNavigationLinkPageLog">PageLog</div>
      </a>
    }
    @if (can('read', 'crawllog')) {
      <a mat-list-item
        [routerLink]="['crawllog']" [routerLinkActive]="['is-active']">
        <mat-icon matListItemIcon>event_note</mat-icon>
        <div matLine i18n="@@reportNavigationLinkCrawlLog">CrawlLog</div>
      </a>
    }
</mat-nav-list>
