<section class="destination-page">
  <h1 i18n="@@reportPageTitle">Reports</h1>
  <nav class="destination-grid" aria-label="Report types" i18n-aria-label="@@reportTypesNavigationLabel">
    @if (can('read', 'jobexecution')) {
      <a class="destination-link" [routerLink]="['/report', 'jobexecution']">
        <mat-card class="destination-card" appearance="outlined">
          <mat-card-header>
            <mat-icon mat-card-avatar>hdr_strong</mat-icon>
            <mat-card-title i18n="@@reportNavigationLinkJobExecution">JobExecution</mat-card-title>
          </mat-card-header>
        </mat-card>
      </a>
    }
    @if (can('read', 'crawlexecution')) {
      <a class="destination-link" [routerLink]="['/report', 'crawlexecution']">
        <mat-card class="destination-card" appearance="outlined">
          <mat-card-header>
            <mat-icon mat-card-avatar>hdr_weak</mat-icon>
            <mat-card-title i18n="@@reportNavigationLinkCrawlExecution">CrawlExecution</mat-card-title>
          </mat-card-header>
        </mat-card>
      </a>
    }
    @if (can('read', 'pagelog')) {
      <a class="destination-link" [routerLink]="['/report', 'pagelog']">
        <mat-card class="destination-card" appearance="outlined">
          <mat-card-header>
            <mat-icon mat-card-avatar>art_track</mat-icon>
            <mat-card-title i18n="@@reportNavigationLinkPageLog">PageLog</mat-card-title>
          </mat-card-header>
        </mat-card>
      </a>
    }
    @if (can('read', 'crawllog')) {
      <a class="destination-link" [routerLink]="['/report', 'crawllog']">
        <mat-card class="destination-card" appearance="outlined">
          <mat-card-header>
            <mat-icon mat-card-avatar>event_note</mat-icon>
            <mat-card-title i18n="@@reportNavigationLinkCrawlLog">CrawlLog</mat-card-title>
          </mat-card-header>
        </mat-card>
      </a>
    }
  </nav>
</section>
