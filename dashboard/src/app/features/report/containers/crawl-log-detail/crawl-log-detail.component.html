@if (item$ | async; as crawlLog) {
  <div class="detail-page">
    <div class="detail-content detail-content-flush">
      <app-crawl-log-status [crawlLog]="crawlLog">
        <app-detail-overflow detailHeaderHelpers label="Crawl log actions"
          i18n-label="@@crawlLogActionsMenuLabel">

        </app-detail-overflow>
      </app-crawl-log-status>
    </div>
  </div>
}
