@let queueSize = queueSize$ | async;
@let watching = (watching$ | async) ?? false;
@if (item$ | async; as jobExecutionStatus) {
  <div class="detail-page">
    <div class="detail-content">
      <app-job-execution-status
        [jobExecutionStatus]="jobExecutionStatus"
        [queueSize]="queueSize">
        <button detailActions class="watch-toggle" mat-icon-button type="button"
          [class.active]="watching"
          [attr.aria-pressed]="watching"
          [disabled]="!watching && JobExecutionStatus.DONE_STATES.includes(jobExecutionStatus.state)"
          [matTooltip]="watching ? stopWatchingLabel : watchUpdatesLabel"
          [attr.aria-label]="watching ? stopWatchingLabel : watchUpdatesLabel"
          (click)="toggleWatch(watching)">
          <mat-icon>refresh</mat-icon>
        </button>
        <app-detail-overflow detailActions label="Job execution actions"
          i18n-label="@@jobExecutionActionsMenuLabel">
          <app-job-execution-shortcut-helpers presentation="menu"
            [jobExecutionStatus]="jobExecutionStatus">
          </app-job-execution-shortcut-helpers>
          <app-execution-abort-action presentation="menu-item" subject="jobexecution"
            [abortable]="jobExecutionStatus.state === JobExecutionState.RUNNING"
            (abort)="onAbortJobExecution(jobExecutionStatus)">
          </app-execution-abort-action>
        </app-detail-overflow>
      </app-job-execution-status>
    </div>
  </div>
}
