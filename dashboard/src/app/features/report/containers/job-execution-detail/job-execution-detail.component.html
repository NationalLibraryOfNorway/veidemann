@if (item$ | async; as jobExecutionStatus) {
  <div class="detail-page">
    <div class="detail-content">
      <app-job-execution-status [jobExecutionStatus]="jobExecutionStatus">
        <app-job-execution-shortcut-helpers detailHeaderHelpers
          [jobExecutionStatus]="jobExecutionStatus">
        </app-job-execution-shortcut-helpers>
        <app-execution-abort-action detailActions subject="jobexecution" [inline]="true"
          [abortable]="jobExecutionStatus.state === JobExecutionState.RUNNING"
          (abort)="onAbortJobExecution(jobExecutionStatus)">
        </app-execution-abort-action>
      </app-job-execution-status>
    </div>
  </div>
}
