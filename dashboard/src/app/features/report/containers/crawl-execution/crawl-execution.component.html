<div class="container layout-column report-list-page">
    @if (loading$ | async) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    @if (query(); as query) {
      <div class="report-filter-toolbar" aria-label="Report filters" i18n-aria-label="@@reportFiltersLabel">
        <app-crawl-execution-status-query class="report-filter-controls"
          [crawlJobOptions]="crawlJobOptions"
        [query]="query"
        (queryChange)="onQueryChange($event)"></app-crawl-execution-status-query>
      </div>
      <div class="report-result-content flex-fill">
        <app-crawl-execution-status-list
          [dataSource]="dataSource"
          [sortDirection]="sortDirection()"
          [sortActive]="sortActive()"
          [hasOverflowActions]="hasActions"
          (rowClick)="onRowClick($event)"
          (sort)="onSort($event)" class="flex-fill"
          >
          <ng-container *appAction="let row">
            @if (can('read', 'pagelog')) {
              <a mat-menu-item
                [routerLink]="['../pagelog']"
                [queryParams]="{execution_id: row.id, watch: isDone(row) ? null : true}"
                aria-label="Go to Page Log" i18n-aria-label="@@reportListActionButtonGoToPagelog"
                matTooltip="Go to Page Log" i18n-matTooltip="@@reportListActionButtonGoToPagelog">
                <mat-icon>art_track</mat-icon>
                <span i18n="@@reportDetailPageLogAction">Page log</span>
              </a>
            }
            @if (can('read', 'crawllog')) {
              <a mat-menu-item
                [routerLink]="['../crawllog']"
                [queryParams]="{execution_id: row.id}"
                aria-label="Go to Crawl Log" i18n-aria-label="@@reportListActionButtonGoToCrawlog"
                matTooltip="Go to Crawl Log" i18n-matTooltip="@@reportListActionButtonGoToCrawlog">
                <mat-icon>event_note</mat-icon>
                <span i18n="@@reportDetailCrawlLogAction">Crawl log</span>
              </a>
            }
            @if (canAbort(row.state) && can('abort', 'crawlexecution')) {
              <button mat-menu-item type="button" (click)="onAbortCrawlExecution(row)">
                <mat-icon>cancel</mat-icon>
                <span i18n="@@reportDetailAbortCrawlAction">Abort crawl</span>
              </button>
            }
          </ng-container>
        </app-crawl-execution-status-list>
      </div>
    }
</div>
