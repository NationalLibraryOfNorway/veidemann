<div class="container layout-column report-list-page">
    @if (loading$ | async) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <app-page-log-query
      [query]="query()"
      (queryChange)="onQueryChange($event)">
    </app-page-log-query>
    <div class="report-result-content flex-fill">
      <app-pagelog-list
        [dataSource]="dataSource"
        [sortDirection]="sortDirection()"
        [sortActive]="sortActive()"
        (rowClick)="onRowClick($event)"
        (sort)="onSort($event)" class="flex-fill">
      </app-pagelog-list>
    </div>
</div>
