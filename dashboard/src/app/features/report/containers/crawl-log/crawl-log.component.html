<div class="container">
    @if (loading$ | async) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    @if (query(); as query) {
      <div class="container no-scroll layout-row">
        <app-crawl-log-query class="content-padding scroll"
        [query]="query" (queryChange)="onQueryChange($event)"></app-crawl-log-query>
        <app-crawl-log-list
          [dataSource]="dataSource"
          [sortDirection]="sortDirection()"
          [sortActive]="sortActive()"
          (rowClick)="onRowClick($event)"
          (sort)="onSort($event)" class="flex-fill"
          >
          @if (can('read', 'jobexecution')) {
            <ng-container *appExtra="let row">
              <a mat-icon-button [routerLink]="['/report', 'jobexecution', row.jobExecutionId]"
                aria-label="Go to job execution" matTooltip="Go to job execution"
                (click)="$event.stopPropagation()"><mat-icon>hdr_strong</mat-icon></a>
            </ng-container>
          }
          <ng-container *appShortcut="let row">
            @if (can('read', 'jobexecution')) {
              <a mat-menu-item
                [routerLink]="['/report', 'jobexecution', row.jobExecutionId]"
                i18n="@@reportListActionButtonGoToJobExecution">
          <mat-icon>hdr_strong</mat-icon>
          Go to job execution
        </a>
            }
            @if (can('read', 'crawlexecution')) {
              <a mat-menu-item
                [routerLink]="['/report', 'crawlexecution', row.executionId]"
                i18n="@@reportListActionButtonGoToCrawlExecution">
          <mat-icon>hdr_weak</mat-icon>
          Go to crawl execution
        </a>
            }
          </ng-container>
        </app-crawl-log-list>
      </div>
    }
</div>
