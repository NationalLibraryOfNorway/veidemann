@if (query(); as query) {
    <div class="container layout-column report-list-page">
      @if (loading$ | async) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }
      <div class="report-filter-toolbar" aria-label="Report filters" i18n-aria-label="@@reportFiltersLabel">
        <app-job-execution-status-query class="report-filter-controls"
          [crawlJobOptions]="crawlJobOptions"
          [query]="query"
        (queryChange)="onQueryChange($event)"></app-job-execution-status-query>
      </div>
      <div class="report-result-content flex-fill">
        <app-job-execution-status-list
          [dataSource]="dataSource"
          [sortDirection]="sortDirection()"
          [sortActive]="sortActive()"
          (rowClick)="onRowClick($event)"
          (sort)="onSort($event)" class="flex-fill"
          >
          <ng-container *appFilter="let row">
            @if (can('read', 'crawlexecution')) {
              <a mat-menu-item
                [routerLink]="['/report', 'crawlexecution']"
                [queryParams]="{job_id: row.jobId, job_execution_id: row.id}"
                i18n="@@reportListActionButtonGoToCrawlExecutionsForJobExecution">
                <mat-icon>hdr_weak</mat-icon>
                Go to crawl executions for this job execution
              </a>
            }
          </ng-container>
        </app-job-execution-status-list>
      </div>
    </div>
}
