apiVersion: apps/v1
kind: Deployment
metadata:
  name: pywb
  labels:
    app.kubernetes.io/name: pywb
    app.kubernetes.io/component: pywb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pywb
      app.kubernetes.io/component: pywb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pywb
        app.kubernetes.io/component: pywb
      annotations:
        linkerd.io/inject: enabled
    spec:
      volumes:
        - name: warc-fallback
          persistentVolumeClaim:
            claimName: warc-fallback
        - name: pywb-config
          configMap:
            name: pywb-config
      initContainers:
        - name: init-pywb-indexes
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - mkdir -p /data/pywb/indexes
          volumeMounts:
            - name: warc-fallback
              mountPath: /data
      containers:
        - name: pywb
          image: webrecorder/pywb:2.9.1
          env:
            - name: UWSGI_MOUNT
              value: /pywb=/pywb/pywb/apps/wayback.py
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: warc-fallback
              mountPath: /webarchive/collections/veidemann/archive
              readOnly: true
            - name: warc-fallback
              mountPath: /webarchive/collections/veidemann/indexes
              subPath: pywb/indexes
            - name: pywb-config
              mountPath: /webarchive/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /pywb/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /pywb/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
