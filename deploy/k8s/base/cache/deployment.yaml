apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/component: cache-balancer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
      app.kubernetes.io/component: cache-balancer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
        app.kubernetes.io/component: cache-balancer
      annotations:
        config.linkerd.io/opaque-ports: "3128"
        config.linkerd.io/proxy-ephemeral-storage-request: "64Mi"
        config.linkerd.io/proxy-ephemeral-storage-limit: "256Mi"
    spec:
      serviceAccountName: cache
      securityContext:
        fsGroup: 13
      volumes:
        - name: cache-spool
          emptyDir:
            sizeLimit: 128Mi
        - name: cache-run
          emptyDir:
            sizeLimit: 16Mi
        - name: cache-config
          emptyDir:
            sizeLimit: 4Mi
        - name: cache-tmp
          emptyDir:
            sizeLimit: 32Mi
      initContainers:
        - name: init-cache-config
          image: ghcr.io/nationallibraryofnorway/veidemann/cache:0.10.2
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              ephemeral-storage: 16Mi
            limits:
              ephemeral-storage: 64Mi
          command:
            - sh
            - -ec
            - |
              cp -R /etc/squid/conf.d/. /generated-config/
              # Keep Squid's network database on the explicitly writable spool.
              printf '%s\n' 'netdb_filename stdio:/var/spool/squid/netdb.state' > /generated-config/30-storage.conf
          volumeMounts:
            - name: cache-config
              mountPath: /generated-config
        - name: wait-for-cache
          image: busybox:1.36
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              ephemeral-storage: 16Mi
            limits:
              ephemeral-storage: 64Mi
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - sh
            - -c
            - |
              host="cache-0.cache.${POD_NAMESPACE}.svc.cluster.local"
              echo "Waiting for ${host}..."
              until nc -z -w 2 "${host}" 3128; do
                sleep 2
              done
              echo "cache-0 is reachable."
      containers:
        - name: cache
          image: ghcr.io/nationallibraryofnorway/veidemann/cache:0.10.2
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cache-spool
              mountPath: /var/spool/squid
            - name: cache-run
              mountPath: /run
            - name: cache-config
              mountPath: /etc/squid/conf.d
            - name: cache-tmp
              mountPath: /tmp
          args:
            - -b # be a balancer
          ports:
            - name: http
              containerPort: 3128
              protocol: TCP
          env:
            - name: DNS_SERVERS
              value: dns-resolver
            - name: SERVICE_NAME
              value: cache
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              ephemeral-storage: 256Mi
              memory: 500Mi
              cpu: 100m
            limits:
              ephemeral-storage: 512Mi
              memory: 500Mi
        - name: cache-exporter
          image: docker.io/boynux/squid-exporter:v1.13.0
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              ephemeral-storage: 32Mi
            limits:
              ephemeral-storage: 128Mi
          ports:
            - name: http-metrics
              containerPort: 9301
              protocol: TCP
          args:
            - "-listen"
            - "0.0.0.0:9301"
