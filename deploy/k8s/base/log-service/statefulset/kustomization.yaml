apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../deployment

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: log-service
    patch: |-
      - op: replace
        path: /kind
        value: StatefulSet
      - op: remove
        path: /spec/strategy
      - op: add
        path: /spec/serviceName
        value: log-service
      - op: add
        path: /spec/podManagementPolicy
        value: Parallel
      - op: add
        path: /spec/persistentVolumeClaimRetentionPolicy
        value:
          whenDeleted: Retain
          whenScaled: Retain
      - op: add
        path: /spec/volumeClaimTemplates
        value:
          - metadata:
              name: parquet
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: parquet
            mountPath: /parquet
