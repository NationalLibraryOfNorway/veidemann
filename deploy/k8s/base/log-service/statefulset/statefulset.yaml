apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: log-service-writer
  labels:
    app.kubernetes.io/name: log-service
    app.kubernetes.io/component: writer
  annotations:
    sidecar.jaegertracing.io/inject: jaeger
spec:
  replicas: 1
  serviceName: log-service-writer
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: log-service
      app.kubernetes.io/component: writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-service
        app.kubernetes.io/component: writer
      annotations:
        linkerd.io/inject: enabled
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: log-service-writer
          image: ghcr.io/nationallibraryofnorway/veidemann/log-service:0.9.2
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: http-metrics
              containerPort: 9153
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: MODE
              value: writer
            - name: LOG_LEVEL
              value: "debug"
            - name: PARQUET_DIR
              value: "/parquet"
            - name: RECENT_LOG_SERVICE_ADDRESS
              value: "log-service:8080"
            - name: RECENT_FORWARD_QUEUE_SIZE
              value: "1024"
            - name: RECENT_FORWARD_WORKERS
              value: "2"
            - name: RECENT_FORWARD_TIMEOUT
              value: "5s"
            - name: RECENT_FORWARD_SHUTDOWN_TIMEOUT
              value: "30s"
            - name: JAEGER_SERVICE_NAME
              value: log-service-writer
            - name: JAEGER_AGENT_HOST
              value: localhost
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: JAEGER_SAMPLER_TYPE
              value: remote
            - name: JAEGER_SAMPLER_PARAM
              value: "0.1"
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/readyz"
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: parquet
              mountPath: /parquet
  volumeClaimTemplates:
    - metadata:
        name: parquet
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
