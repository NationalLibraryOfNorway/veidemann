apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-service
  labels:
    app.kubernetes.io/name: log-service
    app.kubernetes.io/component: recent
  annotations:
    sidecar.jaegertracing.io/inject: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: log-service
      app.kubernetes.io/component: recent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-service
        app.kubernetes.io/component: recent
      annotations:
        linkerd.io/inject: enabled
    spec:
      terminationGracePeriodSeconds: 300
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: recent-logs
          persistentVolumeClaim:
            claimName: log-service-recent-logs
      containers:
        - name: log-service
          image: ghcr.io/nationallibraryofnorway/veidemann/log-service:0.9.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: http-metrics
              containerPort: 9153
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: MODE
              value: recent
            - name: LOG_LEVEL
              value: "debug"
            - name: RECENT_LOG_DB_PATH
              value: "/recent-logs/logs.db"
            - name: RECENT_CRAWL_LOG_MAX_ENTRIES
              value: "1000000"
            - name: RECENT_PAGE_LOG_MAX_ENTRIES
              value: "250000"
            - name: JAEGER_SERVICE_NAME
              value: log-service
            - name: JAEGER_AGENT_HOST
              value: localhost
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: JAEGER_SAMPLER_TYPE
              value: remote
            - name: JAEGER_SAMPLER_PARAM
              value: "0.1"
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/readyz"
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: recent-logs
              mountPath: /recent-logs
