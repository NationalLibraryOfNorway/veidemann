apiVersion: v1
kind: Service
metadata:
  name: log-service-writer
  labels:
    app.kubernetes.io/name: log-service
    app.kubernetes.io/component: log-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: log-service
    app.kubernetes.io/component: log-service
