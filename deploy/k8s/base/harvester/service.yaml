apiVersion: v1
kind: Service
metadata:
  name: harvester
  labels:
    app.kubernetes.io/name: harvester
    app.kubernetes.io/component: harvester
    metrics: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 9301
      protocol: TCP
      targetPort: http-metrics
    - name: http-rp-metrics
      port: 9302
      protocol: TCP
      targetPort: rp-metrics
    - name: http-debug
      port: 3000
      targetPort: debug
  selector:
    app.kubernetes.io/name: harvester
    app.kubernetes.io/component: harvester
