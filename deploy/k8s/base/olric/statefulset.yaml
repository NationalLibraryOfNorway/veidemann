apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: olric
spec:
  serviceName: olric
  replicas: 1
  selector:
    matchLabels:
      app: olric
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/opaque-ports: "3320"
        config.linkerd.io/skip-inbound-ports: "3322"
        config.linkerd.io/skip-outbound-ports: "3322"
        olric/auto-join-port: gossip-tcp
      labels:
        app: olric
    spec:
      serviceAccountName: olricd
      containers:
        - name: olricd
          image: ghcr.io/nationallibraryofnorway/veidemann/olricd:0.7.5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - name: api
              containerPort: 3320
              protocol: TCP
            - name: gossip-tcp
              containerPort: 3322
              protocol: TCP
            - name: gossip-udp
              containerPort: 3322
              protocol: UDP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          env:
            - name: OLRIC_SERVER_CONFIG
              value: /etc/olricd/config.yaml
          volumeMounts:
            - name: olric-config
              mountPath: /etc/olricd/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: olric-config
          configMap:
            name: olric-config
            items:
              - path: config.yaml
                key: config.yaml
