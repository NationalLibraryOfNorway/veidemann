apiVersion: apps/v1
kind: Deployment
metadata:
  name: robots
  labels:
    app.kubernetes.io/name: robots
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: robots
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robots
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/skip-outbound-ports: "3128"
    spec:
      containers:
        - name: robots
          image: ghcr.io/nationallibraryofnorway/veidemann/robots-evaluator:0.14.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - name: grpc
              containerPort: 8090
              protocol: TCP
          env:
            - name: OLRIC_ADDRESS
              value: olric-client:3320
            - name: ROBOTS_CACHE_FRESHNESS
              value: "24h"
            - name: ROBOTS_UNREACHABLE_RETRY_INTERVAL
              value: "1h"
            - name: DNS_RESOLVER_ADDRESS
              value: dns-resolver:8053
            - name: CONTENT_WRITER_ADDRESS
              value: contentwriter:8082
            - name: LOG_SERVICE_ADDRESS
              value: log-service-writer:8080
            - name: CACHE_ADDRESS
              value: cache-balancer:3128
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: 9153
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/readyz"
              port: 9153
            initialDelaySeconds: 15
            periodSeconds: 10
