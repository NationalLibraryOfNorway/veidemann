apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/component: controller
  annotations:
    sidecar.jaegertracing.io/inject: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controller
        app.kubernetes.io/component: controller
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-ephemeral-storage-request: "64Mi"
        config.linkerd.io/proxy-ephemeral-storage-limit: "256Mi"
    spec:
      volumes:
        - name: controller-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: envoy-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: log4j2
          configMap:
            name: controller
            items:
              - key: log4j2.xml
                path: log4j2.xml
        - name: envoy-config
          configMap:
            name: controller-envoy
      containers:
        - name: controller
          image: ghcr.io/nationallibraryofnorway/veidemann/controller:0.16.2
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - name: grpc
              containerPort: 7700
          resources:
            requests:
              ephemeral-storage: 256Mi
            limits:
              ephemeral-storage: 512Mi
          envFrom:
            - secretRef:
                name: rethinkdb-env
                optional: false
          env:
            - name: API_PORT
              value: "7700"
            - name: DB_HOST
              value: "rethinkdb-client"
            - name: DB_PORT
              value: "28015"
            - name: DB_NAME
              value: "veidemann"
            - name: FRONTIER_HOST
              value: "frontier"
            - name: FRONTIER_PORT
              value: "7700"
            - name: SCOPESERVICE_HOST
              value: "scopeservice"
            - name: SCOPESERVICE_PORT
              value: "8080"
            - name: LOG_SERVICE_HOST
              value: "log-service"
            - name: LOG_SERVICE_PORT
              value: "8080"
            - name: AST_SERVICE_URL
              value: "http://localhost:3000/ast"
            - name: OPENID_CONNECT_ISSUER
              value: ""
            - name: SKIP_AUTHENTICATION
              value: "true"
            - name: JAEGER_SERVICE_NAME
              value: "controller"
            - name: JAEGER_AGENT_HOST
              value: "localhost"
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.io.tmpdir=/tmp -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=/opt/java/openjdk/lib/security/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
          volumeMounts:
            - name: controller-tmp
              mountPath: /tmp
            - name: log4j2
              mountPath: /app/resources/log4j2.xml
              subPath: log4j2.xml
        - name: rethinkdb-ast-service
          image: ghcr.io/nationallibraryofnorway/veidemann/rethinkdb-ast-service:0.2.2
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              ephemeral-storage: 64Mi
            limits:
              ephemeral-storage: 256Mi
        - name: envoy
          image: docker.io/envoyproxy/envoy:distroless-v1.39.0
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              ephemeral-storage: 64Mi
            limits:
              ephemeral-storage: 256Mi
          ports:
            - name: admin
              containerPort: 9901
              protocol: TCP
            - name: grpc-web
              containerPort: 10000
              protocol: TCP
          command:
            - envoy
          args:
            - -c
            - /config/envoy.yaml
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 2
          readinessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 2
          volumeMounts:
            - name: envoy-tmp
              mountPath: /tmp
            - name: envoy-config
              mountPath: /config
