---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cache
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cache-ca
spec:
  isCA: true
  duration: 43800h # Five years
  renewBefore: 2160h # 90 days for an operator to roll the parents
  commonName: harvester
  secretName: cache
  subject:
    organizations:
      - veidemann
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: cache
    kind: Issuer
    group: cert-manager.io
