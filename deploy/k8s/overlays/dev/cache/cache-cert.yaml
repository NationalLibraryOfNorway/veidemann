---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cache
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cache-ca
spec:
  isCA: true
  commonName: harvester
  secretName: cache
  subject:
    organizations:
      - veidemann
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cache
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cache-server
spec:
  secretName: cache-server-tls
  isCA: false
  dnsNames:
    - cache
  duration: 2160h
  renewBefore: 720h
  usages:
    - digital signature
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: cache
    kind: Issuer
    group: cert-manager.io
