---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
spec:
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: 250Mi
  template:
    spec:
      containers:
        - name: cache
          env:
            - name: CACHE_DIR_SIZE_MB
              value: "100"
            - name: CACHE_DIR_L1
              value: "8"
            - name: CACHE_DIR_L2
              value: "16"
